name: Simple SSH Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to EC2
        run: |
          # Write SSH private key
          echo "${{ secrets.PRIVATE_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key

          # Connect to server and deploy
          ssh -i ~/ssh_key -o StrictHostKeyChecking=no root@147.182.206.208 << 'EOF'
            # Navigate to project directory (update path if different)
            cd ~/taakra || { echo "Project directory not found"; exit 1; }

            # Pull latest code
            git pull origin main

            # Install dependencies
            pnpm install

            # Restart PM2 dev process if exists, otherwise start
            pm2 restart taakra || pm2 start "pnpm dev" --name taakra

            # Save PM2 process list
            pm2 save

            echo "Dev deployment completed successfully!"
          EOF
